<text x="740" y="499.0" font-size="13.0" fill="#201E1F" text-anchor="start">· gRPC(Arrow Flight) 서버 : max connection age (예 : 수 분) → 주기적 재연결로 재분산</text>
<text x="740" y="517.0" font-size="13.0" fill="#201E1F" text-anchor="start">· client : 채널 · 연결 여러 개 (풀 크기 ≥ 백엔드 수 고려)</text>
<text x="740" y="535.0" font-size="13.0" fill="#201E1F" text-anchor="start">· S3 SDK : 커넥션 풀 수명 · 최대 유휴 시간 제한</text>
<text x="740" y="553.0" font-size="13.0" fill="#201E1F" text-anchor="start">· 대용량 업로드 : 멀티파트 병렬 → 연결 수 확보</text>
<text x="740" y="571.0" font-size="13.0" fill="#201E1F" text-anchor="start">· I Lake 동일 유지 : 적재는 Airflow · Spark Job (K8s 내부, 소켓 LB 경로)</text>
