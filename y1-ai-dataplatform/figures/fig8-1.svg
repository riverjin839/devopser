<text x="700.0" y="45.5" font-size="24.0" fill="#F7F3EC" text-anchor="middle" font-weight="bold">그림 8-1. 연결 단위 분산의 한계 : 장기 연결 · Arrow Flight(gRPC)</text>
<text x="700.0" y="83.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">L4 LB 는 연결이 처음 맺어질 때만 백엔드를 고름 → 연결이 적고 오래 살면 고르게 나뉘지 않음</text>
<text x="360.0" y="129.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">장기 연결 1~2개 (keep-alive · gRPC)</text>
