<text x="60" y="507.0" font-size="17.0" fill="#FFFFFF" text-anchor="start">· HTTP/2 · gRPC 는 연결 하나에 요청을 계속 실음 (멀티플렉싱)</text>
<text x="60" y="529.0" font-size="17.0" fill="#FFFFFF" text-anchor="start">· 그 연결을 받은 백엔드만 바쁨</text>
<text x="60" y="551.0" font-size="17.0" fill="#FFFFFF" text-anchor="start">· Maglev · 소켓 LB 도 연결 단위라 해결 못 함</text>
<text x="60" y="573.0" font-size="17.0" fill="#FFFFFF" text-anchor="start">· I Lake : Arrow Flight 추가됨 → 신규 확인 대상</text>
