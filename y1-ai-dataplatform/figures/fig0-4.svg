<rect x="485.584" y="98.0" width="108.592" height="20" fill="#FCFAF7"/>
<text x="539.88" y="113.0" font-size="13" font-weight="bold" fill="#ACA8A4" text-anchor="middle">백엔드 동기화</text>
<text x="705.0" y="41.0" font-size="14.0" fill="#201E1F" text-anchor="middle" font-weight="bold">ClusterMesh (제어) : KVStoreMesh</text>
<text x="705.0" y="63.0" font-size="14.0" fill="#201E1F" text-anchor="middle">global-svc 백엔드 · identity 를 Compute 클러스터에 동기화</text>
<text x="30" y="137.0" font-size="17.0" fill="#201E1F" text-anchor="start" font-weight="bold">요청 : Pod-IP-c → global-svc → P-IP (PRIVATE · bond1)</text>
<text x="1370" y="619.0" font-size="17.0" fill="#201E1F" text-anchor="end" font-weight="bold">응답 : P-IP → Pod-IP-c (같은 경로 역방향)</text>
<text x="195.0" y="175.5" font-size="18.5" fill="#201E1F" text-anchor="middle" font-weight="bold">① ETL client Pod</text>
<text x="195.0" y="204.75" font-size="18.5" fill="#201E1F" text-anchor="middle">Pod-IP-c (Compute K8s)</text>
<text x="195.0" y="228.25" font-size="18.5" fill="#201E1F" text-anchor="middle">global-svc 로 요청</text>
<text x="200.0" y="285.0" font-size="14.5" fill="#201E1F" text-anchor="middle">Pod-IP-c → global-svc : 443</text>
<text x="200.0" y="304.5" font-size="14.5" fill="#201E1F" text-anchor="middle">(ClusterIP · DNS)</text>
<text x="535.0" y="177.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">② Compute 노드 소켓 LB</text>
<text x="535.0" y="205.5" font-size="20.0" fill="#201E1F" text-anchor="middle">Global Service 백엔드</text>
<text x="535.0" y="230.5" font-size="20.0" fill="#201E1F" text-anchor="middle">= AIStor Pod (원격)</text>
<text x="540.0" y="285.0" font-size="19.5" fill="#201E1F" text-anchor="middle">connect() 시 목적지 변경</text>
<text x="540.0" y="309.5" font-size="19.5" fill="#201E1F" text-anchor="middle">Pod-IP-c → P-IP : 포트</text>
<text x="875.0" y="174.5" font-size="17.5" fill="#201E1F" text-anchor="middle" font-weight="bold">③ Compute 노드 라우팅</text>
<text x="875.0" y="204.25" font-size="17.5" fill="#201E1F" text-anchor="middle">eBPF host routing</text>
<text x="875.0" y="226.75" font-size="17.5" fill="#201E1F" text-anchor="middle">Storage PodCIDR → bond1</text>
<text x="880.0" y="285.0" font-size="15.5" fill="#201E1F" text-anchor="middle">Pod-IP-c → P-IP</text>
<text x="880.0" y="305.5" font-size="15.5" fill="#201E1F" text-anchor="middle">(NAT 없음) · bond1 (802.3ad)</text>
<text x="1215.0" y="174.5" font-size="17.5" fill="#201E1F" text-anchor="middle" font-weight="bold">④ Compute leaf (VTEP)</text>
<text x="1215.0" y="204.25" font-size="17.5" fill="#201E1F" text-anchor="middle">VRF PRIVATE</text>
<text x="1215.0" y="226.75" font-size="17.5" fill="#201E1F" text-anchor="middle">PodCIDR Type-5 → VXLAN</text>
<text x="1220.0" y="276.5" font-size="12.0" fill="#201E1F" text-anchor="middle">바깥 : leaf VTEP(01) → leaf VTEP(03)</text>
<text x="1220.0" y="293.5" font-size="12.0" fill="#201E1F" text-anchor="middle">UDP 4789 · L3VNI PRIVATE</text>
<text x="1220.0" y="310.5" font-size="12.0" fill="#201E1F" text-anchor="middle">안 : Pod-IP-c → P-IP</text>
<text x="1215.0" y="407.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">⑤ Spine · Super Spine</text>
<text x="1215.0" y="435.5" font-size="20.0" fill="#201E1F" text-anchor="middle">DCNY01 → DCNY03</text>
<text x="1215.0" y="460.5" font-size="20.0" fill="#201E1F" text-anchor="middle">구간 간 링크 · ECMP</text>
<text x="1220.0" y="515.0" font-size="12.0" fill="#201E1F" text-anchor="middle">바깥 : leaf VTEP(01) → leaf VTEP(03)</text>
<text x="1220.0" y="532.0" font-size="12.0" fill="#201E1F" text-anchor="middle">안 : Pod-IP-c → P-IP</text>
<text x="875.0" y="405.5" font-size="18.5" fill="#201E1F" text-anchor="middle" font-weight="bold">⑥ Storage leaf (VTEP)</text>
<text x="875.0" y="434.75" font-size="18.5" fill="#201E1F" text-anchor="middle">VXLAN 풂 · VRF PRIVATE</text>
<text x="875.0" y="458.25" font-size="18.5" fill="#201E1F" text-anchor="middle">PodCIDR → 소유 노드 N2</text>
<text x="880.0" y="515.0" font-size="20.0" fill="#201E1F" text-anchor="middle">Pod-IP-c → P-IP</text>
<text x="880.0" y="540.0" font-size="20.0" fill="#201E1F" text-anchor="middle">→ N2 bond1 (802.3ad)</text>
<text x="535.0" y="404.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">⑦ Storage 노드 N2 (bond1)</text>
<text x="535.0" y="434.0" font-size="17.0" fill="#201E1F" text-anchor="middle">eBPF host routing</text>
<text x="535.0" y="456.0" font-size="17.0" fill="#201E1F" text-anchor="middle">정책 확인 → netkit</text>
<text x="540.0" y="515.0" font-size="15.5" fill="#201E1F" text-anchor="middle">Pod-IP-c → P-IP</text>
<text x="540.0" y="535.5" font-size="15.5" fill="#201E1F" text-anchor="middle">identity : ClusterMesh 동기화</text>
<text x="195.0" y="407.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">⑧ AIStor Pod</text>
<text x="195.0" y="435.5" font-size="20.0" fill="#201E1F" text-anchor="middle">S3 PUT 처리</text>
<text x="195.0" y="460.5" font-size="20.0" fill="#201E1F" text-anchor="middle">client IP = Pod-IP-c</text>
<text x="200.0" y="515.0" font-size="20.0" fill="#201E1F" text-anchor="middle">응답 생성</text>
<text x="200.0" y="540.0" font-size="20.0" fill="#201E1F" text-anchor="middle">P-IP → Pod-IP-c</text>
<text x="195.0" y="659.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">⑨ N2 (bond1)</text>
<text x="195.0" y="687.5" font-size="20.0" fill="#201E1F" text-anchor="middle">역방향 그대로</text>
<text x="195.0" y="712.5" font-size="20.0" fill="#201E1F" text-anchor="middle">NAT 없음</text>
<text x="200.0" y="767.0" font-size="20.0" fill="#201E1F" text-anchor="middle">P-IP → Pod-IP-c</text>
<text x="200.0" y="792.0" font-size="20.0" fill="#201E1F" text-anchor="middle">bond1 PRIVATE</text>
<text x="535.0" y="658.5" font-size="19.5" fill="#201E1F" text-anchor="middle" font-weight="bold">⑩ Storage leaf · Spine</text>
<text x="535.0" y="687.25" font-size="19.5" fill="#201E1F" text-anchor="middle">VRF PRIVATE</text>
<text x="535.0" y="711.75" font-size="19.5" fill="#201E1F" text-anchor="middle">VXLAN → Compute leaf</text>
<text x="540.0" y="767.0" font-size="12.0" fill="#201E1F" text-anchor="middle">바깥 : leaf VTEP(03) → leaf VTEP(01)</text>
<text x="540.0" y="784.0" font-size="12.0" fill="#201E1F" text-anchor="middle">안 : P-IP → Pod-IP-c</text>
<text x="875.0" y="659.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">⑪ Compute leaf</text>
<text x="875.0" y="687.5" font-size="20.0" fill="#201E1F" text-anchor="middle">VXLAN 풂</text>
<text x="875.0" y="712.5" font-size="20.0" fill="#201E1F" text-anchor="middle">→ Compute 노드 bond1</text>
<text x="880.0" y="779.5" font-size="20.0" fill="#201E1F" text-anchor="middle">P-IP → Pod-IP-c</text>
<text x="1215.0" y="659.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">⑫ ETL client Pod</text>
<text x="1215.0" y="687.5" font-size="20.0" fill="#201E1F" text-anchor="middle">소켓은 global-svc 로</text>
<text x="1215.0" y="712.5" font-size="20.0" fill="#201E1F" text-anchor="middle">연결된 것으로 인식</text>
<text x="1220.0" y="767.0" font-size="20.0" fill="#201E1F" text-anchor="middle">P-IP → Pod-IP-c</text>
<text x="1220.0" y="792.0" font-size="20.0" fill="#201E1F" text-anchor="middle">(소켓 LB 가 주소 복원)</text>
</svg>