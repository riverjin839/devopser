<text x="60" y="583.0" font-size="19.0" fill="#FFFFFF" text-anchor="start">구조</text>
<text x="60" y="607.0" font-size="19.0" fill="#FFFFFF" text-anchor="start">· underlay : OSPF (또는 IS-IS)</text>
<text x="60" y="631.0" font-size="19.0" fill="#FFFFFF" text-anchor="start">· overlay : iBGP, spine 이 RR</text>
<text x="60" y="655.0" font-size="19.0" fill="#FFFFFF" text-anchor="start">· 노드 ↔ leaf 만 eBGP → VRF 안에서 eBGP · iBGP 혼재</text>
<text x="60" y="679.0" font-size="19.0" fill="#FFFFFF" text-anchor="start">문제</text>
<text x="60" y="703.0" font-size="19.0" fill="#FFFFFF" text-anchor="start">· RR 이 best 1개만 반사 (RD 공통 시)</text>
<text x="60" y="727.0" font-size="19.0" fill="#FFFFFF" text-anchor="start">· eBGP &gt; iBGP 단계에서 로컬 경로만 선택</text>
<text x="60" y="751.0" font-size="19.0" fill="#FFFFFF" text-anchor="start">· maximum-paths ibgp 누락 시 1개 설치</text>
<text x="60" y="775.0" font-size="19.0" fill="#FFFFFF" text-anchor="start">· IGP cost 차이로 multipath 탈락</text>
