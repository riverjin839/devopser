<text x="700.0" y="45.5" font-size="24.0" fill="#F7F3EC" text-anchor="middle" font-weight="bold">그림 2-3. 패브릭 BGP 구조 : iBGP + RR + IGP → eBGP 단일화</text>
<text x="700.0" y="83.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">계층마다 ASN 을 나눠 eBGP 로 통일 → RR · IGP 없이 모든 경로가 그대로 전달되고, 장비별 장애가 독립</text>
<text x="360.0" y="129.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">I Lake : iBGP · eBGP 혼합 (확인됨)</text>
<text x="355.0" y="169.0" font-size="16.0" fill="#201E1F" text-anchor="middle" font-weight="bold">Super Spine</text>
<text x="355.0" y="193.0" font-size="16.0" fill="#201E1F" text-anchor="middle">iBGP 구간</text>
<text x="355.0" y="281.0" font-size="16.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Spine</text>
<text x="355.0" y="305.0" font-size="16.0" fill="#FFFFFF" text-anchor="middle">iBGP RR · best 1 반사</text>
<text x="155.0" y="399.0" font-size="16.0" fill="#201E1F" text-anchor="middle" font-weight="bold">leaf 랙 1</text>
<text x="155.0" y="423.0" font-size="16.0" fill="#201E1F" text-anchor="middle">iBGP 구간</text>
<text x="155.0" y="499.0" font-size="16.0" fill="#201E1F" text-anchor="middle" font-weight="bold">노드 M대</text>
<text x="155.0" y="523.0" font-size="16.0" fill="#201E1F" text-anchor="middle">클러스터 ASN</text>
<text x="355.0" y="399.0" font-size="16.0" fill="#201E1F" text-anchor="middle" font-weight="bold">leaf 랙 2</text>
<text x="355.0" y="423.0" font-size="16.0" fill="#201E1F" text-anchor="middle">iBGP 구간</text>
<text x="355.0" y="499.0" font-size="16.0" fill="#201E1F" text-anchor="middle" font-weight="bold">노드 M대</text>
<text x="355.0" y="523.0" font-size="16.0" fill="#201E1F" text-anchor="middle">클러스터 ASN</text>
