<text x="30" y="39.0" font-size="17.0" fill="#201E1F" text-anchor="start" font-weight="bold">요청 : C-IP → VIP (PUBLIC · bond0)</text>
<text x="1370" y="521.0" font-size="17.0" fill="#201E1F" text-anchor="end" font-weight="bold">응답 : VIP → C-IP (DSR, 인입 노드 미경유)</text>
<text x="195.0" y="79.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">① 외부 ETL client</text>
<text x="195.0" y="107.5" font-size="20.0" fill="#201E1F" text-anchor="middle">C-IP</text>
<text x="195.0" y="132.5" font-size="20.0" fill="#201E1F" text-anchor="middle">S3 요청 (TCP 443)</text>
<text x="200.0" y="198.5" font-size="18.0" fill="#201E1F" text-anchor="middle">C-IP : sport → VIP : 443</text>
<text x="535.0" y="79.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">② FA Core</text>
<text x="535.0" y="107.5" font-size="20.0" fill="#201E1F" text-anchor="middle">방화벽 허용</text>
<text x="535.0" y="132.5" font-size="20.0" fill="#201E1F" text-anchor="middle">VIP 대역 → Border</text>
<text x="540.0" y="187.0" font-size="20.0" fill="#201E1F" text-anchor="middle">C-IP → VIP</text>
<text x="540.0" y="212.0" font-size="20.0" fill="#201E1F" text-anchor="middle">(변경 없음)</text>
<text x="875.0" y="74.5" font-size="15.5" fill="#201E1F" text-anchor="middle" font-weight="bold">③ Border (Super Spine)</text>
<text x="875.0" y="105.25" font-size="15.5" fill="#201E1F" text-anchor="middle">VIP/32 Type-5 · ECMP V 경로</text>
<text x="875.0" y="125.75" font-size="15.5" fill="#201E1F" text-anchor="middle">5-tuple 해시 → leaf 선택</text>
<text x="880.0" y="177.25" font-size="14.5" fill="#201E1F" text-anchor="middle">바깥 : Border VTEP → leaf VTEP</text>
<text x="880.0" y="196.75" font-size="14.5" fill="#201E1F" text-anchor="middle">UDP 4789 · L3VNI PUBLIC</text>
<text x="880.0" y="216.25" font-size="14.5" fill="#201E1F" text-anchor="middle">안 : C-IP → VIP</text>
<text x="1215.0" y="79.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">④ Spine</text>
<text x="1215.0" y="107.5" font-size="20.0" fill="#201E1F" text-anchor="middle">underlay 라우팅</text>
<text x="1215.0" y="132.5" font-size="20.0" fill="#201E1F" text-anchor="middle">바깥 IP(VTEP) 만 봄</text>
<text x="1220.0" y="187.0" font-size="14.5" fill="#201E1F" text-anchor="middle">바깥 : Border VTEP → leaf VTEP</text>
<text x="1220.0" y="206.5" font-size="14.5" fill="#201E1F" text-anchor="middle">안 : C-IP → VIP</text>
<text x="1215.0" y="304.5" font-size="15.5" fill="#201E1F" text-anchor="middle" font-weight="bold">⑤ Storage leaf (VTEP)</text>
<text x="1215.0" y="335.25" font-size="15.5" fill="#201E1F" text-anchor="middle">VXLAN 풂 · VRF PUBLIC</text>
<text x="1215.0" y="355.75" font-size="15.5" fill="#201E1F" text-anchor="middle">VIP/32 → 노드 BGP multipath</text>
<text x="1220.0" y="417.0" font-size="14.5" fill="#201E1F" text-anchor="middle">C-IP → VIP</text>
<text x="1220.0" y="436.5" font-size="14.5" fill="#201E1F" text-anchor="middle">→ 인입 노드 N1 bond0 (802.3ad)</text>
<text x="875.0" y="306.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">⑥ 인입 노드 N1 (bond0)</text>
<text x="875.0" y="336.0" font-size="17.0" fill="#201E1F" text-anchor="middle">Cilium XDP · tc</text>
<text x="875.0" y="358.0" font-size="17.0" fill="#201E1F" text-anchor="middle">Maglev → AIStor Pod (N2)</text>
<text x="880.0" y="417.0" font-size="13.5" fill="#201E1F" text-anchor="middle">바깥 : N1 → N2 (Geneve UDP 6081)</text>
<text x="880.0" y="435.5" font-size="13.5" fill="#201E1F" text-anchor="middle">안 : C-IP → VIP (보존)</text>
<text x="535.0" y="308.0" font-size="19.0" fill="#201E1F" text-anchor="middle" font-weight="bold">⑦ 백엔드 노드 N2</text>
<text x="535.0" y="337.0" font-size="19.0" fill="#201E1F" text-anchor="middle">Geneve 풂 · VIP → P-IP</text>
<text x="535.0" y="361.0" font-size="19.0" fill="#201E1F" text-anchor="middle">netkit 로 Pod 전달</text>
<text x="540.0" y="417.0" font-size="20.0" fill="#201E1F" text-anchor="middle">C-IP → P-IP : 포트</text>
<text x="540.0" y="442.0" font-size="20.0" fill="#201E1F" text-anchor="middle">(client IP 보존)</text>
<text x="195.0" y="309.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">⑧ AIStor Pod</text>
<text x="195.0" y="337.5" font-size="20.0" fill="#201E1F" text-anchor="middle">S3 처리</text>
<text x="195.0" y="362.5" font-size="20.0" fill="#201E1F" text-anchor="middle">client IP = C-IP</text>
<text x="200.0" y="417.0" font-size="20.0" fill="#201E1F" text-anchor="middle">응답 생성</text>
<text x="200.0" y="442.0" font-size="20.0" fill="#201E1F" text-anchor="middle">P-IP → C-IP</text>
<text x="195.0" y="561.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">⑨ N2 역 NAT</text>
<text x="195.0" y="589.5" font-size="20.0" fill="#201E1F" text-anchor="middle">src P-IP → VIP</text>
<text x="195.0" y="614.5" font-size="20.0" fill="#201E1F" text-anchor="middle">bond0 로 직접 송신</text>
<text x="200.0" y="669.0" font-size="18.0" fill="#201E1F" text-anchor="middle">VIP : 443 → C-IP : sport</text>
<text x="200.0" y="692.0" font-size="18.0" fill="#201E1F" text-anchor="middle">인입 노드 N1 미경유 (DSR)</text>
<text x="535.0" y="561.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">⑩ Storage leaf</text>
<text x="535.0" y="589.5" font-size="20.0" fill="#201E1F" text-anchor="middle">VRF PUBLIC</text>
<text x="535.0" y="614.5" font-size="20.0" fill="#201E1F" text-anchor="middle">VXLAN 감쌈 → Border</text>
<text x="540.0" y="669.0" font-size="14.5" fill="#201E1F" text-anchor="middle">바깥 : leaf VTEP → Border VTEP</text>
<text x="540.0" y="688.5" font-size="14.5" fill="#201E1F" text-anchor="middle">안 : VIP → C-IP</text>
<text x="875.0" y="561.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">⑪ Border · FA Core</text>
<text x="875.0" y="589.5" font-size="20.0" fill="#201E1F" text-anchor="middle">VXLAN 풂</text>
<text x="875.0" y="614.5" font-size="20.0" fill="#201E1F" text-anchor="middle">방화벽 세션 일치</text>
<text x="880.0" y="681.5" font-size="20.0" fill="#201E1F" text-anchor="middle">VIP → C-IP</text>
<text x="1215.0" y="561.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">⑫ 외부 ETL client</text>
<text x="1215.0" y="589.5" font-size="20.0" fill="#201E1F" text-anchor="middle">응답 수신</text>
<text x="1215.0" y="614.5" font-size="20.0" fill="#201E1F" text-anchor="middle">src = VIP</text>
<text x="1220.0" y="680.5" font-size="18.0" fill="#201E1F" text-anchor="middle">VIP : 443 → C-IP : sport</text>
</svg>