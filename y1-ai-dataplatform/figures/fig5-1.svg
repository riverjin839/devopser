<text x="260.0" y="340.0" font-size="13" font-weight="bold" fill="#ACA8A4" text-anchor="middle">PUBLIC VIP 접속</text>
<text x="700.0" y="45.5" font-size="24.0" fill="#F7F3EC" text-anchor="middle" font-weight="bold">그림 5-1. bond0 = PUBLIC · bond1 = PRIVATE : 광고 · 응답 경로</text>
<text x="700.0" y="83.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">BGP 인스턴스 2개가 bond 별로 다른 것을 광고. 내부 client 는 PRIVATE VIP, 외부 client 는 PUBLIC VIP → 응답 경로 대칭</text>
<text x="125.0" y="163.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">외부 client</text>
<text x="125.0" y="191.0" font-size="20.0" fill="#201E1F" text-anchor="middle">(FA Core 경유)</text>
<text x="125.0" y="503.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">내부 서버</text>
<text x="125.0" y="531.0" font-size="20.0" fill="#201E1F" text-anchor="middle">(사내 대역)</text>
<text x="475.0" y="163.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">VRF PUBLIC</text>
<text x="475.0" y="191.0" font-size="20.0" fill="#201E1F" text-anchor="middle">leaf 쌍 (bond0 쪽)</text>
<text x="475.0" y="503.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">VRF PRIVATE</text>
<text x="475.0" y="531.0" font-size="20.0" fill="#201E1F" text-anchor="middle">leaf 쌍 (bond1 쪽)</text>
<text x="865.0" y="159.5" font-size="16.5" fill="#201E1F" text-anchor="middle" font-weight="bold">bond0</text>
<text x="865.0" y="187.5" font-size="16.5" fill="#201E1F" text-anchor="middle">802.3ad · layer3+4</text>
<text x="865.0" y="499.5" font-size="16.5" fill="#201E1F" text-anchor="middle" font-weight="bold">bond1</text>
<text x="865.0" y="527.5" font-size="16.5" fill="#201E1F" text-anchor="middle">802.3ad · layer3+4</text>
<text x="1210.0" y="258.5" font-size="15.5" fill="#201E1F" text-anchor="middle" font-weight="bold">AIStor 노드 (Cilium)</text>
<text x="1210.0" y="315.5" font-size="15.5" fill="#201E1F" text-anchor="middle">BGP 인스턴스 A → bond0</text>
<text x="1210.0" y="336.0" font-size="15.5" fill="#201E1F" text-anchor="middle">  PUBLIC VIP /32</text>
<text x="1210.0" y="356.5" font-size="15.5" fill="#201E1F" text-anchor="middle">BGP 인스턴스 B → bond1</text>
<text x="1210.0" y="377.0" font-size="15.5" fill="#201E1F" text-anchor="middle">  PodCIDR · PRIVATE VIP</text>
<text x="1210.0" y="397.5" font-size="15.5" fill="#201E1F" text-anchor="middle">(I Lake : ASN-A · ASN-B 2개)</text>
<text x="580.0" y="290.75" font-size="14.5" fill="#FFFFFF" text-anchor="middle">비대칭 (피할 것)</text>
<text x="580.0" y="310.25" font-size="14.5" fill="#FFFFFF" text-anchor="middle">내부 서버 → PUBLIC VIP</text>
<text x="580.0" y="329.75" font-size="14.5" fill="#FFFFFF" text-anchor="middle">요청 : bond0 로 들어옴</text>
<text x="580.0" y="349.25" font-size="14.5" fill="#FFFFFF" text-anchor="middle">응답 : 목적지가 사내 대역 → bond1</text>
<text x="580.0" y="368.75" font-size="14.5" fill="#FFFFFF" text-anchor="middle">→ 방화벽 · uRPF drop</text>
<text x="40" y="608.0" font-size="20.0" fill="#201E1F" text-anchor="start">원칙 · 판단</text>
<text x="40" y="633.0" font-size="20.0" fill="#201E1F" text-anchor="start">· 노드는 VRF 가 없어 목적지 주소로 출구 bond 를 고름 → 내부 대역은 bond1, 기본 경로는 bond0</text>
<text x="40" y="658.0" font-size="20.0" fill="#201E1F" text-anchor="start">· 내부 client 는 PRIVATE VIP, 외부 client 는 PUBLIC VIP 만 사용 → DNS 를 내부 · 외부로 나눠 강제</text>
<text x="40" y="683.0" font-size="20.0" fill="#201E1F" text-anchor="start">· LB IPAM 풀 PRIVATE · PUBLIC 분리 : I Lake 2개 이상 확인 → 동일 유지</text>
<text x="40" y="708.0" font-size="20.0" fill="#201E1F" text-anchor="start">· BGP 인스턴스 2개 (ASN-A : 2개 광고, ASN-B : 10개 광고) → 어느 쪽이 bond0 인지 확인 후 광고 대상 대조</text>
<text x="40" y="733.0" font-size="20.0" fill="#201E1F" text-anchor="start">· PodCIDR 가 PUBLIC 으로 새지 않게 leaf 수신 필터 (NW) · Cilium 광고 라벨 분리</text>
