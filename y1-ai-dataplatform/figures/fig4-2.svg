<text x="700.0" y="83.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">노드 B 장애 · 작업으로 패브릭이 흐름을 노드 C 로 옮김. 새 노드가 같은 백엔드를 고르는지가 연결 유지를 결정</text>
