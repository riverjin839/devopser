<text x="1215.0" y="433.0" font-size="20.0" fill="#767371" text-anchor="middle" font-weight="bold">Pod Y</text>
<text x="740" y="523.0" font-size="15.0" fill="#201E1F" text-anchor="start">결과</text>
<text x="740" y="543.0" font-size="15.0" fill="#201E1F" text-anchor="start">· 노드 C 도 같은 Maglev 표 (같은 시드 · 백엔드 목록) → 같은 Pod X</text>
<text x="740" y="563.0" font-size="15.0" fill="#201E1F" text-anchor="start">· conntrack 이 없어도 연결 유지</text>
