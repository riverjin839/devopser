<text x="60" y="540.0" font-size="13.5" fill="#FFFFFF" text-anchor="start">· 노드 C 에는 F 의 conntrack 이 없음 → 새 연결로 보고 random 선택</text>
<text x="60" y="558.5" font-size="13.5" fill="#FFFFFF" text-anchor="start">· Pod Y 는 F 를 모름 → RST → S3 요청 실패 · 재시도</text>
<text x="60" y="577.0" font-size="13.5" fill="#FFFFFF" text-anchor="start">· 노드 작업 · leaf 장애 · ECMP 재해시 때마다 반복</text>
