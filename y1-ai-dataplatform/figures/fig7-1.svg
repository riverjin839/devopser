<text x="700.0" y="45.5" font-size="24.0" fill="#F7F3EC" text-anchor="middle" font-weight="bold">그림 7-1. ClusterMesh 3 클러스터 : apiserver 1개 직접 연결 → KVStoreMesh + HA</text>
<text x="700.0" y="83.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">Compute · GPU · Storage 가 서로의 서비스 · 엔드포인트를 공유. 원격 상태를 클러스터마다 캐시하면 연결 수 · 장애 영향이 줄어듦</text>
<text x="360.0" y="126.0" font-size="14.0" fill="#201E1F" text-anchor="middle" font-weight="bold">I Lake : 원격 에이전트가 apiserver 에 직접 (replica 1 · KVStoreMesh 없음)</text>
