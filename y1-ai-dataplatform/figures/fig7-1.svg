<text x="60" y="467.0" font-size="17.0" fill="#201E1F" text-anchor="start">· remote 2/2 ready (Compute · GPU 로 추정, 확인 필요)</text>
<text x="60" y="489.0" font-size="17.0" fill="#201E1F" text-anchor="start">· clustermesh-apiserver replica 1, KVStoreMesh 없음</text>
<text x="60" y="511.0" font-size="17.0" fill="#201E1F" text-anchor="start">· 원격 클러스터의 모든 에이전트가 apiserver 1개에 직접 연결</text>
