<text x="495.0" y="258.0" font-size="13" font-weight="bold" fill="#817E7B" text-anchor="middle">NAT 된 패킷</text>
<line x1="495.0" y1="350" x2="495.0" y2="400" stroke="#817E7B" stroke-width="1.5" marker-end="url(#mnorm)"/>
<line x1="940" y1="188.0" x2="1010" y2="188.0" stroke="#5F8B5A" stroke-width="2.5" marker-end="url(#mgood)"/>
<line x1="1175.0" y1="226" x2="1175.0" y2="280" stroke="#5F8B5A" stroke-width="2.5" marker-end="url(#mgood)"/>
<rect x="1125.696" y="243.0" width="98.608" height="20" fill="#FCFAF7"/>
<text x="1175.0" y="258.0" font-size="13" font-weight="bold" fill="#5F8B5A" text-anchor="middle">Pod IP 직결</text>
<line x1="1175.0" y1="350" x2="1175.0" y2="400" stroke="#5F8B5A" stroke-width="2.5" marker-end="url(#mgood)"/>
<text x="700.0" y="45.5" font-size="24.0" fill="#F7F3EC" text-anchor="middle" font-weight="bold">그림 4-4. 내부 client (Compute · GPU Pod) → AIStor : 소켓 LB off → on</text>
<text x="700.0" y="82.75" font-size="16.5" fill="#201E1F" text-anchor="middle" font-weight="bold">소켓 LB 는 connect() 한 번에 백엔드 Pod IP 를 정함. off 면 패킷마다 NAT · conntrack. Global Service 로 다른 클러스터 AIStor 까지 직결</text>
<text x="360.0" y="129.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">I Lake : 소켓 LB off (bpf-lb-sock=false)</text>
<text x="155.0" y="181.0" font-size="18.0" fill="#201E1F" text-anchor="middle" font-weight="bold">ETL · 학습 Pod</text>
<text x="155.0" y="212.0" font-size="18.0" fill="#201E1F" text-anchor="middle">(Compute · GPU)</text>
<text x="490.0" y="177.0" font-size="14.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">패킷마다 tc BPF</text>
<text x="490.0" y="208.0" font-size="14.0" fill="#FFFFFF" text-anchor="middle">ClusterIP → Pod DNAT · 응답 역변환</text>
<text x="490.0" y="313.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">PRIVATE VRF (bond1)</text>
<text x="490.0" y="341.0" font-size="20.0" fill="#201E1F" text-anchor="middle">구간 간 링크 → DCNY03</text>
<text x="490.0" y="433.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">AIStor Pod (전체 중 1)</text>
<text x="490.0" y="464.0" font-size="20.0" fill="#201E1F" text-anchor="middle">Storage 클러스터</text>
<text x="60" y="531.0" font-size="13.0" fill="#201E1F" text-anchor="start">현상</text>
<text x="60" y="549.0" font-size="13.0" fill="#201E1F" text-anchor="start">· I Lake Storage 클러스터 bpf-lb-sock = false (명시)</text>
<text x="60" y="567.0" font-size="13.0" fill="#201E1F" text-anchor="start">· 패킷마다 서비스 변환 → 노드 CPU · conntrack 사용 증가</text>
<text x="60" y="585.0" font-size="13.0" fill="#201E1F" text-anchor="start">· 분산은 되지만 효율 낮음</text>
<text x="60" y="603.0" font-size="13.0" fill="#201E1F" text-anchor="start">확인 : Compute · GPU 클러스터 값, 끈 이유, Global Service affinity 값 (1개 존재)</text>
<text x="1040.0" y="129.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">Y1 : 소켓 LB on + Global Service</text>
<text x="835.0" y="181.0" font-size="18.0" fill="#201E1F" text-anchor="middle" font-weight="bold">ETL · 학습 Pod</text>
<text x="835.0" y="212.0" font-size="18.0" fill="#201E1F" text-anchor="middle">(Compute · GPU)</text>
<text x="1170.0" y="178.0" font-size="15.0" fill="#201E1F" text-anchor="middle" font-weight="bold">connect() 훅 (cgroup BPF)</text>
<text x="1170.0" y="209.0" font-size="15.0" fill="#201E1F" text-anchor="middle">목적지 = AIStor Pod IP 로 1회 변경</text>
<text x="1170.0" y="313.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">PRIVATE VRF (bond1)</text>
<text x="1170.0" y="341.0" font-size="20.0" fill="#201E1F" text-anchor="middle">구간 간 링크 → DCNY03</text>
<text x="1170.0" y="433.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">AIStor Pod (전체 중 1)</text>
<text x="1170.0" y="464.0" font-size="20.0" fill="#201E1F" text-anchor="middle">Storage 클러스터</text>
<text x="740" y="531.0" font-size="13.0" fill="#201E1F" text-anchor="start">효과</text>
<text x="740" y="549.0" font-size="13.0" fill="#201E1F" text-anchor="start">· 패킷 단위 NAT · conntrack 없음 → CPU 절감, 대용량 I/O 유리</text>
<text x="740" y="567.0" font-size="13.0" fill="#201E1F" text-anchor="start">· 분산 단위 = 연결 (connect 시점). 연결 수가 많을수록 고르게</text>
<text x="740" y="585.0" font-size="13.0" fill="#201E1F" text-anchor="start">· Global Service (service.cilium.io/global=true) 로 Compute · GPU → Storage 백엔드 직접</text>
<text x="740" y="603.0" font-size="13.0" fill="#201E1F" text-anchor="start">· affinity 미설정 (none) 유지</text>
<text x="740" y="621.0" font-size="13.0" fill="#201E1F" text-anchor="start">주의 : 의도적으로 끈 이유 (호환 · 정책) 가 있는지 먼저 확인</text>
</svg>