<text x="700.0" y="45.5" font-size="24.0" fill="#F7F3EC" text-anchor="middle" font-weight="bold">그림 4-3. externalTrafficPolicy : Local → Cluster</text>
<text x="700.0" y="83.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">같은 leaf 에 붙은 client 는 BGP 상 로컬 랙 노드로만 들어옴 (정상). Local 이면 처리도 그 랙에 묶이고, Cluster + Maglev 면 전체로 나뉨</text>
<text x="360.0" y="129.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">I Lake : Local (LoadBalancer 4개)</text>
<text x="355.0" y="173.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">같은 leaf client</text>
<text x="355.0" y="283.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">랙 1 인입 노드</text>
<text x="355.0" y="316.0" font-size="20.0" fill="#201E1F" text-anchor="middle">(로컬 랙만 수신)</text>
<text x="145.0" y="429.5" font-size="16.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">랙 1 AIStor Pod</text>
<text x="355.0" y="429.5" font-size="16.5" fill="#767371" text-anchor="middle" font-weight="bold">랙 2 AIStor Pod</text>
<text x="565.0" y="429.5" font-size="16.5" fill="#767371" text-anchor="middle" font-weight="bold">랙 3 AIStor Pod</text>
<text x="60" y="537.5" font-size="19.5" fill="#FFFFFF" text-anchor="start">결과</text>
<text x="60" y="562.0" font-size="19.5" fill="#FFFFFF" text-anchor="start">· 로컬 Pod 만 처리 → 인입 쏠림이 처리 쏠림으로 그대로</text>
<text x="60" y="586.5" font-size="19.5" fill="#FFFFFF" text-anchor="start">· VIP 를 광고하는 노드도 로컬 Pod 있는 노드로 줄어듦</text>
<text x="60" y="611.0" font-size="19.5" fill="#FFFFFF" text-anchor="start">· 현행 불균형의 직접 원인 후보</text>
<text x="60" y="635.5" font-size="19.5" fill="#FFFFFF" text-anchor="start">확인 필요 : Local 4개가 AIStor VIP 인지</text>
<text x="1040.0" y="129.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">Y1 : Cluster + Maglev</text>
<text x="1035.0" y="173.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">같은 leaf client</text>
<text x="1035.0" y="283.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">랙 1 인입 노드</text>
<text x="1035.0" y="316.0" font-size="20.0" fill="#201E1F" text-anchor="middle">(로컬 랙만 수신)</text>
<text x="825.0" y="429.5" font-size="16.5" fill="#201E1F" text-anchor="middle" font-weight="bold">랙 1 AIStor Pod</text>
<text x="1035.0" y="429.5" font-size="16.5" fill="#201E1F" text-anchor="middle" font-weight="bold">랙 2 AIStor Pod</text>
<text x="1245.0" y="429.5" font-size="16.5" fill="#201E1F" text-anchor="middle" font-weight="bold">랙 3 AIStor Pod</text>
<text x="740" y="538.0" font-size="20.0" fill="#201E1F" text-anchor="start">결과</text>
<text x="740" y="563.0" font-size="20.0" fill="#201E1F" text-anchor="start">· 인입이 로컬이어도 처리는 전체 Pod 로 분산</text>
<text x="740" y="588.0" font-size="20.0" fill="#201E1F" text-anchor="start">· DSR 로 client IP 보존 (Local 의 장점 유지)</text>
<text x="740" y="613.0" font-size="20.0" fill="#201E1F" text-anchor="start">· Maglev 로 인입 노드가 바뀌어도 같은 Pod</text>
<text x="740" y="638.0" font-size="20.0" fill="#201E1F" text-anchor="start">확인 : AIStor VIP 의 ETP = Cluster</text>
