<text x="700.0" y="45.5" font-size="24.0" fill="#F7F3EC" text-anchor="middle" font-weight="bold">그림 2-1. VIP 광고 방식 : BGP 유지 (L2 는 참고)</text>
<text x="700.0" y="83.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">LB IPAM 은 주소만 정함. 분산은 VIP 를 알리는 방식이 결정 → L2 면 VIP 당 노드 1대, BGP 면 광고 노드 전체 ECMP</text>
<text x="360.0" y="128.5" font-size="16.5" fill="#201E1F" text-anchor="middle" font-weight="bold">참고 : L2 announcement (ARP) 였다면 (I Lake 는 BGP · 해당 없음)</text>
<text x="355.0" y="167.0" font-size="14.0" fill="#201E1F" text-anchor="middle" font-weight="bold">ETL client</text>
<text x="355.0" y="189.0" font-size="14.0" fill="#201E1F" text-anchor="middle">S3 → VIP</text>
<text x="355.0" y="278.0" font-size="15.0" fill="#201E1F" text-anchor="middle" font-weight="bold">DCNY03 Storage leaf 쌍</text>
<text x="355.0" y="303.0" font-size="15.0" fill="#201E1F" text-anchor="middle">VIP → ARP 응답한 MAC 1개</text>
<text x="82.0" y="407.0" font-size="14.0" fill="#FFFFFF" text-anchor="middle" font-weight="bold">노드 1</text>
<text x="82.0" y="438.5" font-size="14.0" fill="#FFFFFF" text-anchor="middle">lease</text>
<text x="82.0" y="457.5" font-size="14.0" fill="#FFFFFF" text-anchor="middle">100%</text>
<text x="160.0" y="407.0" font-size="14.0" fill="#767371" text-anchor="middle" font-weight="bold">노드 2</text>
<text x="160.0" y="448.0" font-size="14.0" fill="#767371" text-anchor="middle">0%</text>
<text x="238.0" y="407.0" font-size="14.0" fill="#767371" text-anchor="middle" font-weight="bold">노드 3</text>
<text x="238.0" y="448.0" font-size="14.0" fill="#767371" text-anchor="middle">0%</text>
<text x="316.0" y="407.0" font-size="14.0" fill="#767371" text-anchor="middle" font-weight="bold">노드 4</text>
<text x="316.0" y="448.0" font-size="14.0" fill="#767371" text-anchor="middle">0%</text>
<text x="394.0" y="407.0" font-size="14.0" fill="#767371" text-anchor="middle" font-weight="bold">노드 5</text>
<text x="394.0" y="448.0" font-size="14.0" fill="#767371" text-anchor="middle">0%</text>
<text x="472.0" y="407.0" font-size="14.0" fill="#767371" text-anchor="middle" font-weight="bold">노드 6</text>
<text x="472.0" y="448.0" font-size="14.0" fill="#767371" text-anchor="middle">0%</text>
<text x="550.0" y="407.0" font-size="14.0" fill="#767371" text-anchor="middle" font-weight="bold">노드 7</text>
<text x="550.0" y="448.0" font-size="14.0" fill="#767371" text-anchor="middle">0%</text>
<text x="628.0" y="407.0" font-size="14.0" fill="#767371" text-anchor="middle" font-weight="bold">노드 M</text>
<text x="628.0" y="448.0" font-size="14.0" fill="#767371" text-anchor="middle">0%</text>
<text x="60" y="532.5" font-size="20.0" fill="#FFFFFF" text-anchor="start">동작</text>
<text x="60" y="557.5" font-size="20.0" fill="#FFFFFF" text-anchor="start">· VIP 마다 lease 를 가진 노드 1대만 ARP 응답</text>
<text x="60" y="582.5" font-size="20.0" fill="#FFFFFF" text-anchor="start">· 그 VIP 의 모든 요청이 노드 1대로 인입</text>
<text x="60" y="607.5" font-size="20.0" fill="#FFFFFF" text-anchor="start">· 장애 시 lease 이전까지 끊김</text>
<text x="60" y="632.5" font-size="20.0" fill="#FFFFFF" text-anchor="start">· 패브릭 ECMP · iBGP/eBGP 설정과 무관하게 쏠림</text>
<text x="60" y="690.5" font-size="16.5" fill="#201E1F" text-anchor="start">확인</text>
<text x="60" y="712.0" font-size="16.5" fill="#201E1F" text-anchor="start">kubectl get ciliuml2announcementpolicy</text>
<text x="60" y="733.5" font-size="16.5" fill="#201E1F" text-anchor="start">kubectl -n kube-system get lease | grep cilium-l2announce</text>
<text x="60" y="755.0" font-size="16.5" fill="#201E1F" text-anchor="start">→ 있으면 L2 방식 = 불균형 1순위 원인</text>
<text x="1040.0" y="129.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">I Lake · Y1 : BGP 광고 (CiliumBGPAdvertisement) [동일 유지]</text>
<text x="1035.0" y="167.0" font-size="14.0" fill="#201E1F" text-anchor="middle" font-weight="bold">ETL client</text>
<text x="1035.0" y="189.0" font-size="14.0" fill="#201E1F" text-anchor="middle">S3 → VIP</text>
<text x="1035.0" y="277.0" font-size="14.0" fill="#201E1F" text-anchor="middle" font-weight="bold">DCNY03 Storage leaf 쌍</text>
<text x="1035.0" y="302.0" font-size="14.0" fill="#201E1F" text-anchor="middle">VIP /32 → 랙 노드 M개 ECMP</text>
<text x="762.0" y="407.0" font-size="14.0" fill="#201E1F" text-anchor="middle" font-weight="bold">노드 1</text>
<text x="762.0" y="448.0" font-size="14.0" fill="#201E1F" text-anchor="middle">1/M</text>
<text x="840.0" y="407.0" font-size="14.0" fill="#201E1F" text-anchor="middle" font-weight="bold">노드 2</text>
<text x="840.0" y="448.0" font-size="14.0" fill="#201E1F" text-anchor="middle">1/M</text>
<text x="918.0" y="407.0" font-size="14.0" fill="#201E1F" text-anchor="middle" font-weight="bold">노드 3</text>
<text x="918.0" y="448.0" font-size="14.0" fill="#201E1F" text-anchor="middle">1/M</text>
<text x="996.0" y="407.0" font-size="14.0" fill="#201E1F" text-anchor="middle" font-weight="bold">노드 4</text>
<text x="996.0" y="448.0" font-size="14.0" fill="#201E1F" text-anchor="middle">1/M</text>
<text x="1074.0" y="407.0" font-size="14.0" fill="#201E1F" text-anchor="middle" font-weight="bold">노드 5</text>
<text x="1074.0" y="448.0" font-size="14.0" fill="#201E1F" text-anchor="middle">1/M</text>
