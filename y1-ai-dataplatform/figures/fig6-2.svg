<text x="700.0" y="45.5" font-size="24.0" fill="#F7F3EC" text-anchor="middle" font-weight="bold">그림 6-2. NIC 큐 · IRQ 배치 : 전체 코어 96 → NUMA 로컬</text>
<text x="700.0" y="83.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">NIC 이 붙은 NUMA 의 코어가 그 NIC 의 인터럽트 · 패킷 처리를 맡아야 원격 메모리 접근이 없음</text>
<text x="360.0" y="129.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">I Lake : 큐 96 · irqbalance</text>
<text x="200.0" y="165.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">NUMA 0 (CPU 0 ~ 47)</text>
<text x="520.0" y="165.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">NUMA 1 (CPU 48 ~ 95)</text>
<text x="195.0" y="211.5" font-size="18.5" fill="#201E1F" text-anchor="middle" font-weight="bold">NIC A (bond 멤버 1)</text>
<text x="195.0" y="239.5" font-size="18.5" fill="#201E1F" text-anchor="middle">ice · NUMA 0</text>
<text x="515.0" y="211.5" font-size="18.5" fill="#201E1F" text-anchor="middle" font-weight="bold">NIC B (bond 멤버 2)</text>
<text x="515.0" y="239.5" font-size="18.5" fill="#201E1F" text-anchor="middle">ice · NUMA 1</text>
<text x="195.0" y="363.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">코어 0 ~ 47</text>
<text x="515.0" y="363.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">코어 48 ~ 95</text>
<text x="60" y="498.0" font-size="20.0" fill="#201E1F" text-anchor="start">현상</text>
<text x="60" y="523.0" font-size="20.0" fill="#201E1F" text-anchor="start">· 큐 96 = 전체 코어 → 절반은 원격 NUMA 에서 처리</text>
<text x="60" y="548.0" font-size="20.0" fill="#201E1F" text-anchor="start">· irqbalance 가 IRQ 를 수시로 옮김</text>
<text x="60" y="573.0" font-size="20.0" fill="#201E1F" text-anchor="start">· bond 멤버 2개가 서로 다른 NUMA 에 붙음 (n0 · n1)</text>
<text x="60" y="598.0" font-size="20.0" fill="#201E1F" text-anchor="start">· 고부하에서 rx drop · 지연 편차 원인</text>
<text x="1040.0" y="129.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">Y1 : NUMA 로컬 고정</text>
<text x="880.0" y="165.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">NUMA 0 (CPU 0 ~ 47)</text>
<text x="1200.0" y="165.0" font-size="17.0" fill="#201E1F" text-anchor="middle" font-weight="bold">NUMA 1 (CPU 48 ~ 95)</text>
<text x="875.0" y="211.5" font-size="18.5" fill="#201E1F" text-anchor="middle" font-weight="bold">NIC A (bond 멤버 1)</text>
<text x="875.0" y="239.5" font-size="18.5" fill="#201E1F" text-anchor="middle">ice · NUMA 0</text>
<text x="1195.0" y="211.5" font-size="18.5" fill="#201E1F" text-anchor="middle" font-weight="bold">NIC B (bond 멤버 2)</text>
<text x="1195.0" y="239.5" font-size="18.5" fill="#201E1F" text-anchor="middle">ice · NUMA 1</text>
<text x="875.0" y="363.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">코어 0 ~ 47</text>
<text x="1195.0" y="363.0" font-size="20.0" fill="#201E1F" text-anchor="middle" font-weight="bold">코어 48 ~ 95</text>
<text x="740" y="494.0" font-size="16.0" fill="#201E1F" text-anchor="start">설정</text>
<text x="740" y="515.0" font-size="16.0" fill="#201E1F" text-anchor="start">· ethtool -L &lt;nic&gt; combined &lt;로컬 코어 수&gt;</text>
<text x="740" y="536.0" font-size="16.0" fill="#201E1F" text-anchor="start">· IRQ → /sys/class/net/&lt;nic&gt;/device/local_cpulist 로 고정</text>
<text x="740" y="557.0" font-size="16.0" fill="#201E1F" text-anchor="start">· irqbalance 에서 NIC IRQ 제외 (또는 중지) · tuned 와 한 방식만</text>
<text x="740" y="578.0" font-size="16.0" fill="#201E1F" text-anchor="start">· 효과 : 캐시 지역성, 100G 에서 rx drop · 지연 감소</text>
