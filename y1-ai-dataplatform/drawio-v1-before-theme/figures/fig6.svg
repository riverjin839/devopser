<text x="700.0" y="42.5" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">그림 6. 패브릭 ECMP 해시 : 단일 seed → 계층별 seed + resilient hashing</text>
<text x="700.0" y="81.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">결론 : 다단 ECMP 쏠림(polarization) 제거, 노드 1대 제거 시 살아 있는 연결은 그대로</text>
<text x="360.0" y="125" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">전 : 1차</text>
<text x="360.0" y="160.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Super Spine</text>
<text x="360.0" y="177.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">seed = 기본값</text>
<text x="200.0" y="270.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Spine 1</text>
<text x="200.0" y="287.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">seed = 기본값</text>
<text x="520.0" y="270.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Spine 2</text>
<text x="520.0" y="287.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">seed = 기본값</text>
<text x="120.0" y="408.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf 1</text>
<text x="280.0" y="408.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf 2</text>
<text x="440.0" y="408.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf 3</text>
<text x="600.0" y="408.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf 4</text>
<text x="60" y="589.0" font-size="13" fill="#222222" text-anchor="start">증상</text>
<text x="60" y="607.0" font-size="13" fill="#222222" text-anchor="start">· 상위 계층과 같은 해시 → 하위 계층에서 같은 쪽만 선택</text>
<text x="60" y="625.0" font-size="13" fill="#222222" text-anchor="start">· 장비 수는 늘었는데 링크 절반이 유휴</text>
<text x="60" y="643.0" font-size="13" fill="#222222" text-anchor="start">· ECMP 멤버 1개 제거 시 전체 재해시</text>
<text x="60" y="661.0" font-size="13" fill="#222222" text-anchor="start">   → 무관한 연결까지 다른 노드로 이동</text>
<text x="60" y="679.0" font-size="13" fill="#222222" text-anchor="start">· Maglev 가 없으면 이동한 연결은 끊김</text>
<text x="1040.0" y="125" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">후 : 2차 (Y1)</text>
<text x="1040.0" y="160.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Super Spine</text>
<text x="1040.0" y="177.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">seed = 101</text>
<text x="880.0" y="270.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Spine 1</text>
<text x="880.0" y="287.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">seed = 201</text>
<text x="1200.0" y="270.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Spine 2</text>
<text x="1200.0" y="287.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">seed = 201</text>
<text x="800.0" y="408.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf 1</text>
<text x="960.0" y="408.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf 2</text>
<text x="1120.0" y="408.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf 3</text>
<text x="1280.0" y="408.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf 4</text>
<text x="740" y="580.0" font-size="13" fill="#222222" text-anchor="start">적용</text>
<text x="740" y="598.0" font-size="13" fill="#222222" text-anchor="start">· ip load-sharing address source-destination port source-destination</text>
<text x="740" y="616.0" font-size="13" fill="#222222" text-anchor="start">   universal-id &lt;계층별 값&gt; : 계층마다 다른 해시 결과</text>
<text x="740" y="634.0" font-size="13" fill="#222222" text-anchor="start">· hardware profile ecmp resilient : 멤버 제거 시 해당 버킷만 재배치</text>
<text x="740" y="652.0" font-size="13" fill="#222222" text-anchor="start">· 5-tuple 유지 (SNAT 된 client 도 포트로 분산)</text>
<text x="740" y="670.0" font-size="13" fill="#222222" text-anchor="start">· Geneve DSR 구간 : 외부 UDP 소스 포트가 내부 흐름 해시 → ECMP 유지</text>
<text x="740" y="688.0" font-size="13" fill="#222222" text-anchor="start">검증 : show routing hash, 인터페이스 카운터 편차 ±10%</text>
</svg>