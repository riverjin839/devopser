<text x="700.0" y="42.5" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">그림 5. 노드 : veth + bond(LACP) → netkit + 포트별 L3 (RHEL 10 · Cilium 1.20)</text>
<text x="700.0" y="81.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">결론 : Pod 에서 NIC 까지 커널 스택 왕복 제거, ToR 쌍 의존 제거, XDP 를 물리 NIC 에 직접 부착</text>
<text x="360.0" y="125" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">전 : 일반 구성</text>
<text x="360.0" y="168.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Pod (S3 · SQL)</text>
<text x="360.0" y="245.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">veth 쌍</text>
<text x="360.0" y="262.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">호스트 쪽에서 softirq 재진입</text>
<text x="360.0" y="333.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">호스트 스택</text>
<text x="360.0" y="350.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">iptables · conntrack 경유</text>
<text x="360.0" y="433.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">bond0 (LACP mode 4)</text>
<text x="360.0" y="450.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">XDP 부착 조건 까다로움</text>
<text x="170.0" y="540.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">ToR A (vPC)</text>
<text x="550.0" y="540.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">ToR B (vPC)</text>
<text x="60" y="649.0" font-size="13" fill="#222222" text-anchor="start">한계</text>
<text x="60" y="667.0" font-size="13" fill="#222222" text-anchor="start">· Pod ↔ 호스트 구간에서 CPU 2회 소모 (veth + 스택)</text>
<text x="60" y="685.0" font-size="13" fill="#222222" text-anchor="start">· ToR 쌍이 peer-link · keepalive 로 묶임 → split-brain 위험</text>
<text x="60" y="703.0" font-size="13" fill="#222222" text-anchor="start">· L2 도메인이 랙 쌍에 걸침 → 장애 범위 큼</text>
<text x="60" y="721.0" font-size="13" fill="#222222" text-anchor="start">· 기본 sysctl : 송신 ECMP 가 IP 만 해시 → 포트 하나에 몰림</text>
<text x="60" y="739.0" font-size="13" fill="#222222" text-anchor="start">· 기본 TCP 버퍼 · ring 크기 → 100G 에서 drop</text>
<text x="1040.0" y="125" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">후 : 2차 (Y1)</text>
<text x="1040.0" y="168.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Pod (S3 · SQL)</text>
<text x="1040.0" y="245.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">netkit (L3 장치)</text>
<text x="1040.0" y="262.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">eBPF 프로그램을 Pod 쪽 장치에서 실행</text>
<text x="1040.0" y="333.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">eBPF host routing</text>
<text x="1040.0" y="350.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">netfilter 우회 · BBR / BIG TCP 가능</text>
<text x="890.0" y="433.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">ens1f0 (L3 /31)</text>
<text x="890.0" y="450.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">BGP 세션 A · XDP</text>
<text x="1190.0" y="433.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">ens1f1 (L3 /31)</text>
<text x="1190.0" y="450.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">BGP 세션 B · XDP</text>
<text x="890.0" y="540.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf A (독립)</text>
<text x="1190.0" y="540.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf B (독립)</text>
<text x="740" y="640.0" font-size="13" fill="#222222" text-anchor="start">OS 튜닝 (RHEL 10)</text>
<text x="740" y="658.0" font-size="13" fill="#222222" text-anchor="start">· fib_multipath_hash_policy=1, fib_multipath_use_neigh=1</text>
<text x="740" y="676.0" font-size="13" fill="#222222" text-anchor="start">· rp_filter=0 (ECMP 비대칭 경로), 루프백 /32 = 노드 IP</text>
<text x="740" y="694.0" font-size="13" fill="#222222" text-anchor="start">· tcp 버퍼 상향, BBR + fq, MTU 9000</text>
<text x="740" y="712.0" font-size="13" fill="#222222" text-anchor="start">· ring 버퍼 최대, 큐 수 = NUMA 로컬 코어, LRO off</text>
<text x="740" y="730.0" font-size="13" fill="#222222" text-anchor="start">· tuned network-throughput, firewalld 중지</text>
<text x="740" y="748.0" font-size="13" fill="#222222" text-anchor="start">효과 : leaf 1대 장애 = 세션 1개만 끊김. 쌍 동시 작업 불필요</text>
</svg>