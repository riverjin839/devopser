<text x="700.0" y="42.5" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">그림 7. 랙 배치 : 불균등 → 랙당 노드 수 균일 + 서비스 Pod 랙 분산</text>
<text x="700.0" y="81.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">결론 : 패브릭은 랙(VTEP) 단위로 균등 분산 → 랙당 노드 수가 같아야 노드 부하가 같음. Maglev 는 인입 노드 부하를 못 고침</text>
<text x="360.0" y="125" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">전 : 배치 정책 없음 (증설 후 예시)</text>
<text x="360.0" y="160.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Border / Super Spine</text>
<text x="360.0" y="177.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">(외부 ETL 인입)</text>
<text x="120.0" y="273.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">랙 A</text>
<text x="120.0" y="290.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf 쌍 (VTEP)</text>
<text x="120.0" y="372.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">노드 8대</text>
<text x="120.0" y="389.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">노드당 1/32</text>
<text x="280.0" y="273.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">랙 B</text>
<text x="280.0" y="290.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf 쌍 (VTEP)</text>
<text x="280.0" y="372.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">노드 8대</text>
<text x="280.0" y="389.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">노드당 1/32</text>
<text x="440.0" y="273.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">랙 C</text>
<text x="440.0" y="290.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf 쌍 (VTEP)</text>
<text x="440.0" y="363.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">노드 4대</text>
<text x="440.0" y="380.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">노드당 1/16</text>
<text x="440.0" y="397.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">(인입 2배)</text>
<text x="600.0" y="273.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">랙 D</text>
<text x="600.0" y="290.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf 쌍 (VTEP)</text>
<text x="600.0" y="372.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">노드 8대</text>
<text x="600.0" y="389.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">노드당 1/32</text>
<text x="360.0" y="467.0" font-size="12" fill="#222222" text-anchor="middle">StarRocks FE 3대 → 스케줄러가 한 랙에 모두 배치 가능</text>
<text x="360.0" y="484.0" font-size="12" fill="#222222" text-anchor="middle">AIStor erasure set → 특정 랙에 몰릴 수 있음</text>
<text x="60" y="614.0" font-size="13" fill="#222222" text-anchor="start">문제</text>
<text x="60" y="632.0" font-size="13" fill="#222222" text-anchor="start">· 랙 C 만 4대 → 같은 1/4 몫을 절반 노드가 받음 → 노드당 2배</text>
<text x="60" y="650.0" font-size="13" fill="#222222" text-anchor="start">· PUT 본문은 인입 노드 경유 → 랙 C 노드 NIC 먼저 포화</text>
<text x="60" y="668.0" font-size="13" fill="#222222" text-anchor="start">· Maglev 는 처리 Pod 만 균등. 인입 노드 부하는 못 고침</text>
<text x="60" y="686.0" font-size="13" fill="#222222" text-anchor="start">· 랙 장애 시 잃는 용량이 랙마다 다름</text>
<text x="60" y="704.0" font-size="13" fill="#222222" text-anchor="start">· 서비스 Pod 가 한 랙에 몰리면 랙 1개 장애로 FE 전체 중단</text>
<text x="1040.0" y="125" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">후 : 2차 (Y1 원칙)</text>
<text x="1040.0" y="160.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Border / Super Spine</text>
<text x="1040.0" y="177.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">(외부 ETL 인입)</text>
<text x="800.0" y="273.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">랙 A</text>
<text x="800.0" y="290.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf 쌍 (VTEP)</text>
<text x="800.0" y="372.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">노드 8대</text>
<text x="800.0" y="389.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">노드당 1/32</text>
<text x="960.0" y="273.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">랙 B</text>
<text x="960.0" y="290.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf 쌍 (VTEP)</text>
<text x="960.0" y="372.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">노드 8대</text>
<text x="960.0" y="389.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">노드당 1/32</text>
<text x="1120.0" y="273.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">랙 C</text>
<text x="1120.0" y="290.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf 쌍 (VTEP)</text>
<text x="1120.0" y="372.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">노드 8대</text>
<text x="1120.0" y="389.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">노드당 1/32</text>
<text x="1280.0" y="273.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">랙 D</text>
<text x="1280.0" y="290.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">leaf 쌍 (VTEP)</text>
<text x="1280.0" y="372.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">노드 8대</text>
<text x="1280.0" y="389.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">노드당 1/32</text>
<text x="1040.0" y="467.0" font-size="12" fill="#222222" text-anchor="middle">StarRocks FE 3대 → 랙 A · B · C 에 1대씩 (topologySpreadConstraints)</text>
<text x="1040.0" y="484.0" font-size="12" fill="#222222" text-anchor="middle">AIStor erasure set → 랙마다 같은 수의 드라이브</text>
<text x="740" y="596.0" font-size="13" fill="#222222" text-anchor="start">원칙</text>
<text x="740" y="614.0" font-size="13" fill="#222222" text-anchor="start">· 랙당 노드 수 균일 (Storage 8 · Com 18), 증설은 랙 단위</text>
<text x="740" y="632.0" font-size="13" fill="#222222" text-anchor="start">· 불균일 불가피 시 export-gateway-ip + maximum-paths mixed</text>
<text x="740" y="650.0" font-size="13" fill="#222222" text-anchor="start">· 노드 라벨 topology.kubernetes.io/zone = 랙</text>
<text x="740" y="668.0" font-size="13" fill="#222222" text-anchor="start">· FE · CN · Egress GW · control plane · ClusterMesh apiserver 랙 분산</text>
<text x="740" y="686.0" font-size="13" fill="#222222" text-anchor="start">· AIStor erasure set · pool 을 랙에 고르게 (AIStor 문서 확인)</text>
<text x="740" y="704.0" font-size="13" fill="#222222" text-anchor="start">· NIC · 케이블 구성 랙별 동일</text>
<text x="740" y="722.0" font-size="13" fill="#222222" text-anchor="start">검증 : T12 랙 간 인입 편차 ±10%</text>
